name: Scrape players

on:
  schedule:
    # Mondays 03:17 UTC
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      max-players:
        description: Players to scrape (lower it for a quick test run)
        default: "300"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build
        run: ./mvnw -B -q -DskipTests package

      # The runner image already has Chrome and chromedriver, Selenium Manager picks them up.
      - name: Scrape
        env:
          SCRAPER_MAX_PLAYERS: ${{ inputs.max-players || '300' }}
        run: >
          java -jar target/cs-stats-api-*.jar
          --spring.profiles.active=scrape
          --scraper.snapshot-path=out/players-snapshot.json

      # A GitHub release asset has a stable public URL, which the API downloads.
      - name: Publish snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Latest player data" --notes "Updated by the scrape workflow. Not a software release."
          gh release upload data out/players-snapshot.json --clobber
