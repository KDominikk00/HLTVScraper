spring.application.name=cs-stats-api

scraper.base-url=https://bo3.gg
scraper.refresh-interval=24h
scraper.snapshot-path=data/players-snapshot.json
scraper.allowed-origins=http://localhost:5173
scraper.request-delay=2s
scraper.page-timeout=30s
scraper.headless=true
scraper.max-players=300
scraper.max-tournaments=12
scraper.min-players=20
# browser: scrape in this process. remote: download a snapshot published by a scrape job (needs scraper.snapshot-url).
scraper.source=browser
server.shutdown=graceful
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
