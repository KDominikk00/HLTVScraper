app = "cs-stats-api"
primary_region = "fra"

[build]

[env]
  # Comma separated. Set the real site with: fly secrets set SCRAPER_ALLOWED_ORIGINS=https://your-site
  SCRAPER_ALLOWED_ORIGINS = "http://localhost:5173"

[http_service]
  internal_port = 8080
  force_https = true
  # The machine has to stay up, it scrapes on its own schedule.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/actuator/health"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
